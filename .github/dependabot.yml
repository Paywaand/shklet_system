version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      non-critical:
        patterns: ["*"]
        exclude-patterns: ["prisma", "@prisma/*", "next"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
