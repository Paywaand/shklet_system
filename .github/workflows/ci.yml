name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # NOTE: lint is intentionally omitted until ESLint is configured for this
      # repo (`next lint` currently prompts interactively with no config and
      # cannot run in CI). Tracked as a follow-up. Type checking is the gate.
      - name: Type check
        run: npx tsc --noEmit
